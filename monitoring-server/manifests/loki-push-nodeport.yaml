# Push endpoint for Vector on the app cluster: http://${MONITORING_SERVER_IP}:30100/loki/api/v1/push
apiVersion: v1
kind: Service
metadata:
  name: loki-push
  namespace: monitoring
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: loki, app.kubernetes.io/component: single-binary }
  ports: [{ name: http, port: 3100, targetPort: 3100, nodePort: 30100 }]
