apiVersion: v1
kind: Namespace
metadata:
  name: ai
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: ai
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 15Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ai
  labels: { app.kubernetes.io/name: ollama }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: ollama }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ollama }
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:0.40.4
          ports: [{ name: http, containerPort: 11434 }]
          env:
            - { name: OLLAMA_KEEP_ALIVE, value: "24h" }   # keep the model in RAM between alerts
            - { name: OLLAMA_NUM_PARALLEL, value: "1" }
            - { name: OLLAMA_MAX_LOADED_MODELS, value: "1" }   # one model in RAM at a time
            - { name: OLLAMA_CONTEXT_LENGTH, value: "16384" }
          resources:
            requests: { cpu: "2", memory: 8Gi }
            limits: { memory: 20Gi }   # no CPU limit: llama.cpp uses every core, a CFS cap only slows it down
          readinessProbe:
            httpGet: { path: /, port: http }
          volumeMounts:
            - { name: models, mountPath: /root/.ollama }
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: ollama-models }
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: ai
spec:
  selector: { app.kubernetes.io/name: ollama }
  ports: [{ name: http, port: 11434, targetPort: http }]
