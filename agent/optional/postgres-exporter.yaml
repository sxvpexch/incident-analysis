# Optional: Postgres internals (longest active query, connections) so DB slowness is proven from the DB side.
# Edit the DSN and secret names, then: render agent/optional/postgres-exporter.yaml | kubectl apply -f -
# Postgres internals (active queries, longest running query, connections, locks) so a slow DB
# can be proven from the database side, not just inferred from the API.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: ${APP_NAMESPACE}
  labels: { app.kubernetes.io/name: postgres-exporter }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres-exporter }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres-exporter }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
          args: ["--collector.stat_activity_autovacuum", "--collector.long_running_transactions"]
          ports: [{ name: metrics, containerPort: 9187 }]
          env:
            - { name: DATA_SOURCE_URI, value: "postgres:5432/mydb?sslmode=disable" }   # <service>:<port>/<database>
            - name: DATA_SOURCE_USER
              valueFrom: { secretKeyRef: { name: db-credentials, key: DB_USER } }
            - name: DATA_SOURCE_PASS
              valueFrom: { secretKeyRef: { name: db-credentials, key: DB_PASSWORD } }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 250m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy        # only needed if Postgres denies ingress by default
metadata: { name: allow-exporter-to-postgres, namespace: ${APP_NAMESPACE} }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: postgres } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app.kubernetes.io/name: postgres-exporter } } }]
      ports: [{ port: 5432 }]
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata: { name: postgres-exporter, namespace: monitoring }
spec:
  namespaceSelector: { matchNames: [${APP_NAMESPACE}] }
  selector: { matchLabels: { app.kubernetes.io/name: postgres-exporter } }
  podMetricsEndpoints:
    - port: metrics
      interval: 15s
      relabelings: [{ targetLabel: app, replacement: postgres }]

